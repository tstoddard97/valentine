<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Cici ♡</title>
  
  <!-- Google Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #FFC0CB;
      font-family: "Press Start 2P", sans-serif;
      color: #FF0000;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
      padding: 5vw;
      box-sizing: border-box;
    }
    .console-container {
      width: 100%;
      max-width: 90vw;
    }
    .pulsing {
      font-size: 5vw;
      animation: pulse 1s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.5; }
      100% { opacity: 1; }
    }
    #prompt-container {
      display: none;
      margin-top: 5vw;
      width: 100%;
    }
    #prompt-text {
      min-height: 20vw;
      margin-bottom: 5vw;
      font-size: 4vw;
      white-space: pre-wrap;
      text-align: center;
      line-height: 1.6;
    }
    .button {
      background: transparent;
      border: 3px solid #FF0000;
      color: #FF0000;
      padding: 3vw;
      cursor: pointer;
      font-size: 4vw;
      font-family: "Press Start 2P", sans-serif;
      display: none;
      width: 90%;
      max-width: 400px;
    }
    .gif-container {
      display: none;
      opacity: 0;
      transform: translateY(5vw);
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
      margin-bottom: 5vw;
      width: 100%;
    }
    .gif-container img {
      width: 100%;
      max-width: 90vw;
      height: auto;
    }
    .heart-container {
      display: none;
      margin-top: 5vw;
    }
    .heart-container img {
      width: 20vw;
      height: auto;
    }
  </style>
</head>
<body>
  <audio id="background-music" loop autoplay>
    <source src="https://kappa.vgmsite.com/soundtracks/stardew-valley/srjzgabwfi/81.%20Movie%20Theater.mp3" type="audio/mpeg">
  </audio>

  <div class="console-container">
    <div id="start-screen">
      <div class="pulsing">Tap to begin!</div>
    </div>
    <div id="prompt-container">
      <div id="prompt-text"></div>
      <div id="gif-container" class="gif-container">
        <img id="gif" src="" alt="GIF">
      </div>
      <button id="continue-btn" class="button">Continue</button>
      <div id="heart-container" class="heart-container">
        <img src="https://opengameart.org/sites/default/files/heart%20pixel%20art%20254x254.png" alt="Pixel Heart">
      </div>
    </div>
  </div>
</body>
</html>
